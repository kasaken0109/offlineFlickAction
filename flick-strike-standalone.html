<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flick Strike">
  <style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

:root {
  --primary: #00d4ff;
  --accent: #ff6b35;
  --danger: #ff2d55;
  --success: #30d158;
  --gold: #ffd60a;
  --bg: #0a0a1a;
  --card: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.1);
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
  touch-action: none;
}

#gameCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#ui-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 10;
}

/* ── HUD ── */
#hud {
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#hud-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 16px 20px;
  padding-top: max(16px, env(safe-area-inset-top));
}

#score-display, #wave-display, #lives-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
}

#score {
  font-size: 28px;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: 0.05em;
  text-shadow: 0 0 20px var(--primary);
  transition: transform 0.1s;
}

#score.pop {
  transform: scale(1.3);
}

#wave {
  font-size: 28px;
  font-weight: 800;
  color: #fff;
}

#lives-hearts {
  display: flex;
  gap: 4px;
  font-size: 20px;
}

#combo-display {
  position: absolute;
  bottom: 25%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
}

#combo-count {
  font-size: 52px;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 30px var(--gold), 0 0 60px rgba(255,214,10,0.4);
  display: block;
  line-height: 1;
}

#combo-display .label {
  font-size: 14px;
  color: var(--gold);
  letter-spacing: 0.3em;
}

#wave-announce {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 36px;
  font-weight: 900;
  color: #fff;
  text-align: center;
  text-shadow: 0 0 30px var(--primary);
  white-space: nowrap;
  animation: waveIn 0.4s ease-out;
}

@keyframes waveIn {
  from { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

#pause-btn {
  position: absolute;
  top: max(12px, env(safe-area-inset-top));
  right: 16px;
  width: 40px;
  height: 40px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  pointer-events: all;
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

#pause-btn:active { background: rgba(255,255,255,0.15); }

/* ── Screens ── */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(10,10,26,0.92);
  backdrop-filter: blur(12px);
  pointer-events: all;
  z-index: 20;
}

.screen-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 40px 32px;
  max-width: 340px;
  width: 100%;
}

.game-title {
  text-align: center;
  line-height: 0.9;
}

.title-flick {
  display: block;
  font-size: 56px;
  font-weight: 900;
  color: var(--primary);
  text-shadow: 0 0 40px var(--primary), 0 0 80px rgba(0,212,255,0.3);
  letter-spacing: 0.1em;
  animation: titlePulse 2s ease-in-out infinite;
}

.title-strike {
  display: block;
  font-size: 40px;
  font-weight: 900;
  color: var(--accent);
  text-shadow: 0 0 30px var(--accent);
  letter-spacing: 0.2em;
}

@keyframes titlePulse {
  0%, 100% { text-shadow: 0 0 40px var(--primary), 0 0 80px rgba(0,212,255,0.3); }
  50% { text-shadow: 0 0 60px var(--primary), 0 0 120px rgba(0,212,255,0.5); }
}

.subtitle {
  color: rgba(255,255,255,0.7);
  font-size: 14px;
  letter-spacing: 0.05em;
}

.instructions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
}

.inst-item {
  display: flex;
  align-items: center;
  gap: 12px;
  color: rgba(255,255,255,0.85);
  font-size: 14px;
}

.inst-icon {
  font-size: 22px;
  width: 32px;
  text-align: center;
}

.btn-primary {
  width: 100%;
  padding: 18px;
  background: linear-gradient(135deg, var(--primary), #0080ff);
  border: none;
  border-radius: 16px;
  color: #fff;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.05em;
  cursor: pointer;
  pointer-events: all;
  box-shadow: 0 4px 24px rgba(0,212,255,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.btn-primary:active {
  transform: scale(0.96);
  box-shadow: 0 2px 12px rgba(0,212,255,0.3);
}

.btn-secondary {
  width: 100%;
  padding: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  color: rgba(255,255,255,0.7);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  pointer-events: all;
  transition: background 0.15s;
}

.btn-secondary:active { background: rgba(255,255,255,0.1); }

#best-score-display {
  color: var(--gold);
  font-size: 14px;
  font-weight: 700;
}

/* result */
.result-stats {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 14px 20px;
  color: rgba(255,255,255,0.85);
  font-size: 16px;
  border-bottom: 1px solid var(--border);
}

.stat-row:last-child { border-bottom: none; }

.stat-row span:last-child {
  font-weight: 800;
  color: var(--primary);
}

.stat-row.highlight {
  background: rgba(255,214,10,0.1);
}

.stat-row.highlight span {
  color: var(--gold) !important;
}

#gameover-title, #pause-screen h2 {
  font-size: 40px;
  font-weight: 900;
  color: var(--danger);
  text-shadow: 0 0 30px var(--danger);
  letter-spacing: 0.1em;
}

#pause-screen h2 {
  color: var(--primary);
  text-shadow: 0 0 30px var(--primary);
}

/* ── Upgrade screen ── */
.upgrade-wave-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--gold);
  text-transform: uppercase;
}

.upgrade-title {
  font-size: 28px;
  font-weight: 900;
  color: #fff;
  letter-spacing: 0.08em;
  margin: -8px 0 0;
}

.upgrade-cards {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}

.upgrade-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 16px;
  cursor: pointer;
  pointer-events: all;
  text-align: left;
  width: 100%;
  transition: transform 0.12s, background 0.12s;
  position: relative;
  overflow: hidden;
}

.upgrade-card:active {
  transform: scale(0.97);
  background: rgba(255,255,255,0.1);
}

.upgrade-card.rarity-common  { border-color: rgba(255,255,255,0.2); }
.upgrade-card.rarity-rare    { border-color: var(--primary); box-shadow: 0 0 16px rgba(0,212,255,0.2); }
.upgrade-card.rarity-epic    { border-color: #bf5af2; box-shadow: 0 0 16px rgba(191,90,242,0.25); }

.upgrade-icon {
  font-size: 30px;
  width: 40px;
  text-align: center;
  flex-shrink: 0;
  line-height: 1;
}

.upgrade-info { flex: 1; min-width: 0; }

.upgrade-name {
  font-size: 16px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 3px;
}

.upgrade-desc {
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  line-height: 1.4;
}

.upgrade-rarity-badge {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.1em;
  padding: 3px 6px;
  border-radius: 6px;
  flex-shrink: 0;
}

.upgrade-rarity-badge.rarity-common { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.5); }
.upgrade-rarity-badge.rarity-rare   { background: rgba(0,212,255,0.15); color: var(--primary); }
.upgrade-rarity-badge.rarity-epic   { background: rgba(191,90,242,0.2); color: #bf5af2; }

/* utilities */
.hidden { display: none !important; }

/* damage flash overlay */
#damage-flash {
  position: fixed;
  inset: 0;
  background: rgba(255,45,85,0.35);
  pointer-events: none;
  z-index: 50;
  opacity: 0;
  transition: opacity 0.1s;
}

#damage-flash.active {
  opacity: 1;
  transition: none;
}

<script>
// Web Audio API - synthetic sound effects (no files needed, works offline)
const Audio = (() => {
  let ctx = null;

  function getCtx() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function playTone({ type = 'sine', freq = 440, freq2 = null, gain = 0.3, attack = 0.01, decay = 0.1, duration = 0.15 }) {
    try {
      const c = getCtx();
      const osc = c.createOscillator();
      const gainNode = c.createGain();
      osc.connect(gainNode);
      gainNode.connect(c.destination);

      osc.type = type;
      osc.frequency.setValueAtTime(freq, c.currentTime);
      if (freq2) osc.frequency.linearRampToValueAtTime(freq2, c.currentTime + duration);

      gainNode.gain.setValueAtTime(0, c.currentTime);
      gainNode.gain.linearRampToValueAtTime(gain, c.currentTime + attack);
      gainNode.gain.exponentialRampToValueAtTime(0.001, c.currentTime + attack + decay);

      osc.start(c.currentTime);
      osc.stop(c.currentTime + duration);
    } catch (_) {}
  }

  function playNoise({ gain = 0.2, duration = 0.1, filterFreq = 800 }) {
    try {
      const c = getCtx();
      const bufferSize = c.sampleRate * duration;
      const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const source = c.createBufferSource();
      source.buffer = buffer;

      const filter = c.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = filterFreq;
      filter.Q.value = 0.5;

      const gainNode = c.createGain();
      gainNode.gain.setValueAtTime(gain, c.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);

      source.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(c.destination);
      source.start();
    } catch (_) {}
  }

  return {
    flick() {
      playTone({ type: 'square', freq: 300, freq2: 800, gain: 0.25, attack: 0.005, decay: 0.08, duration: 0.12 });
    },
    hit() {
      playTone({ type: 'sawtooth', freq: 180, freq2: 80, gain: 0.3, attack: 0.005, decay: 0.12, duration: 0.15 });
      playNoise({ gain: 0.15, duration: 0.08, filterFreq: 1200 });
    },
    enemyDeath() {
      playTone({ type: 'square', freq: 440, freq2: 880, gain: 0.2, attack: 0.005, decay: 0.15, duration: 0.18 });
    },
    combo(count) {
      const note = 220 * Math.pow(1.12, Math.min(count, 20));
      playTone({ type: 'triangle', freq: note, freq2: note * 1.5, gain: 0.25, attack: 0.01, decay: 0.2, duration: 0.25 });
    },
    damage() {
      playNoise({ gain: 0.4, duration: 0.2, filterFreq: 300 });
      playTone({ type: 'sawtooth', freq: 80, freq2: 40, gain: 0.35, attack: 0.005, decay: 0.25, duration: 0.3 });
    },
    waveStart(wave) {
      const freqs = [261, 329, 392, 523];
      freqs.forEach((f, i) => {
        setTimeout(() => {
          playTone({ type: 'triangle', freq: f, gain: 0.2, attack: 0.02, decay: 0.2, duration: 0.3 });
        }, i * 80);
      });
    },
    gameOver() {
      [440, 330, 220, 110].forEach((f, i) => {
        setTimeout(() => {
          playTone({ type: 'sawtooth', freq: f, gain: 0.2, attack: 0.02, decay: 0.3, duration: 0.35 });
        }, i * 120);
      });
    },
    unlock() {
      playTone({ type: 'triangle', freq: 880, freq2: 1760, gain: 0.25, attack: 0.01, decay: 0.3, duration: 0.4 });
    }
  };
})();

// Particle system for visual effects
class ParticleSystem {
  constructor() {
    this.particles = [];
  }

  emit(x, y, opts = {}) {
    const {
      count = 8,
      color = '#00d4ff',
      speed = 3,
      spreadAngle = Math.PI * 2,
      dirAngle = 0,
      size = 4,
      life = 0.6,
      gravity = 0,
      type = 'circle',
    } = opts;

    for (let i = 0; i < count; i++) {
      const angle = dirAngle + (spreadAngle * (Math.random() - 0.5));
      const spd = speed * (0.5 + Math.random() * 0.8);
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        size: size * (0.6 + Math.random() * 0.8),
        color,
        life,
        maxLife: life,
        gravity,
        type,
      });
    }
  }

  emitHit(x, y, dirAngle, color = '#ff6b35') {
    // Main burst
    this.emit(x, y, { count: 12, color, speed: 5, spreadAngle: Math.PI * 0.8, dirAngle, size: 5, life: 0.5, gravity: 0.05 });
    // Sparks
    this.emit(x, y, { count: 6, color: '#ffd60a', speed: 8, spreadAngle: Math.PI * 0.6, dirAngle, size: 3, life: 0.4, gravity: 0.1 });
    // Ring
    this.emitRing(x, y, { color, radius: 0, maxRadius: 40, life: 0.3 });
  }

  emitRing(x, y, opts = {}) {
    const { color = '#00d4ff', radius = 0, maxRadius = 60, life = 0.4, lineWidth = 2 } = opts;
    this.particles.push({ type: 'ring', x, y, radius, maxRadius, color, life, maxLife: life, lineWidth });
  }

  emitDamage(cx, cy) {
    this.emit(cx, cy, { count: 20, color: '#ff2d55', speed: 6, size: 6, life: 0.7, gravity: 0.08 });
    this.emitRing(cx, cy, { color: '#ff2d55', maxRadius: 80, life: 0.4, lineWidth: 3 });
  }

  emitScore(x, y, text, color = '#ffd60a') {
    this.particles.push({ type: 'text', x, y, vy: -1.5, text, color, life: 0.9, maxLife: 0.9 });
  }

  emitTrail(x, y, color = '#00d4ff', size = 3) {
    this.particles.push({
      type: 'circle', x, y,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      size, color, life: 0.25, maxLife: 0.25, gravity: 0,
    });
  }

  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      if (p.life <= 0) { this.particles.splice(i, 1); continue; }

      if (p.type === 'ring') {
        p.radius += (p.maxRadius / p.maxLife) * dt;
        continue;
      }
      if (p.type === 'text') {
        p.y += p.vy;
        continue;
      }
      p.x += p.vx;
      p.y += p.vy;
      if (p.gravity) p.vy += p.gravity;
    }
  }

  draw(ctx) {
    for (const p of this.particles) {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;

      if (p.type === 'ring') {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.lineWidth * alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.stroke();
      } else if (p.type === 'text') {
        ctx.fillStyle = p.color;
        ctx.font = `bold ${20 * (0.7 + alpha * 0.3)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.fillText(p.text, p.x, p.y);
      } else {
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.size * 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }
}

// Enemy definitions and logic
const ENEMY_TYPES = {
  grunt: {
    color: '#ff6b35',
    glowColor: 'rgba(255,107,53,0.4)',
    radius: 18,
    hp: 1,
    speed: 90,
    score: 100,
    shape: 'circle',

class Enemy {
  constructor(type, x, y, targetX, targetY) {
    const def = ENEMY_TYPES[type];
    Object.assign(this, def);
    this.type = type;
    this.x = x;
    this.y = y;
    this.maxHp = def.hp;
    // hitRadius is larger than visual radius for more forgiving hit detection
    this.hitRadius = def.radius * 1.6;
    this.angle = Math.atan2(targetY - y, targetX - x);
    this.vx = Math.cos(this.angle) * this.speed;
    this.vy = Math.sin(this.angle) * this.speed;
    this.dead = false;
    this.hitFlash = 0;
    this.pulsePhase = Math.random() * Math.PI * 2;
    this.wobble = 0;
  }

  update(dt, playerX, playerY) {
    if (this.dead) return;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.pulsePhase += dt * 3;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    this.wobble += dt * 5;

    // Shooter type zigzags
    if (this.type === 'fast') {
      const perp = this.angle + Math.PI / 2;
      this.x += Math.sin(this.wobble * 2) * 1.2;
      this.y += Math.cos(this.wobble * 2) * 1.2;
    }
  }

  hit(dmg = 1) {
    this.hp -= dmg;
    this.hitFlash = 0.15;
    return this.hp <= 0;
  }

  draw(ctx) {
    if (this.dead) return;
    const pulse = 1 + Math.sin(this.pulsePhase) * 0.06;
    const r = this.radius * pulse;
    const flash = this.hitFlash > 0;

    ctx.save();
    ctx.translate(this.x, this.y);

    // Glow
    ctx.shadowColor = this.glowColor;
    ctx.shadowBlur = 20 + Math.sin(this.pulsePhase) * 8;

    const color = flash ? '#ffffff' : this.color;

    if (this.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    } else if (this.shape === 'diamond') {
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(r * 0.7, 0);
      ctx.lineTo(0, r);
      ctx.lineTo(-r * 0.7, 0);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    } else if (this.shape === 'hexagon') {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    } else if (this.shape === 'triangle') {
      const rot = this.pulsePhase * 0.5;
      ctx.rotate(rot);
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2 - Math.PI / 2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    } else if (this.shape === 'star') {
      ctx.rotate(this.pulsePhase * 0.3);
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
        const rad = i % 2 === 0 ? r : r * 0.45;
        ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    // HP bar for multi-hp enemies
    if (this.maxHp > 1) {
      const bw = r * 2;
      const bh = 4;
      const by = r + 6;
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(-bw / 2, by, bw, bh);
      ctx.fillStyle = this.hp / this.maxHp > 0.5 ? '#30d158' : this.hp / this.maxHp > 0.25 ? '#ffd60a' : '#ff2d55';
      ctx.fillRect(-bw / 2, by, bw * (this.hp / this.maxHp), bh);
    }

    ctx.restore();
  }
}

class EnemyManager {
  constructor() {
    this.enemies = [];
    this.spawnTimer = 0;
    this.wave = 1;
    this.waveConfig = this._buildWaveConfig(1);
  }

  _buildWaveConfig(wave) {
    const base = {
      spawnInterval: Math.max(0.6, 2.0 - wave * 0.1),
      types: ['grunt'],
      maxEnemies: 8 + wave * 2,
    };
    if (wave >= 2) base.types.push('fast');
    if (wave >= 3) base.types.push('tank');
    if (wave >= 4) base.types.push('shooter');
    if (wave >= 6) base.spawnInterval = Math.max(0.4, base.spawnInterval);
    return base;
  }

  setWave(wave) {
    this.wave = wave;
    this.waveConfig = this._buildWaveConfig(wave);
    this.enemies = [];
    this.spawnTimer = 0;

    // Boss wave every 5 waves
    if (wave % 5 === 0) {
      this.pendingBoss = true;
    }
  }

  spawnEnemy(cw, ch) {
    const cfg = this.waveConfig;
    const type = cfg.types[Math.floor(Math.random() * cfg.types.length)];
    const cx = cw / 2, cy = ch / 2;

    // Spawn on edge
    let x, y;
    const side = Math.floor(Math.random() * 4);
    if (side === 0) { x = Math.random() * cw; y = -40; }
    else if (side === 1) { x = cw + 40; y = Math.random() * ch; }
    else if (side === 2) { x = Math.random() * cw; y = ch + 40; }
    else { x = -40; y = Math.random() * ch; }

    this.enemies.push(new Enemy(type, x, y, cx, cy));
  }

  spawnBoss(cw, ch) {
    const x = cw / 2;
    const y = -60;
    this.enemies.push(new Enemy('boss', x, y, cw / 2, ch / 2));
    this.pendingBoss = false;
  }

  update(dt, cw, ch, playerRadius) {
    const cfg = this.waveConfig;

    // Spawn logic
    if (this.enemies.length < cfg.maxEnemies) {
      this.spawnTimer += dt;
      if (this.spawnTimer >= cfg.spawnInterval) {
        this.spawnTimer = 0;
        if (this.pendingBoss && this.enemies.length === 0) {
          this.spawnBoss(cw, ch);
        } else if (!this.pendingBoss) {
          this.spawnEnemy(cw, ch);
        }
      }
    }

    const cx = cw / 2, cy = ch / 2;
    const reached = [];

    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      e.update(dt, cx, cy);

      if (e.dead) { this.enemies.splice(i, 1); continue; }

      const dx = e.x - cx, dy = e.y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < playerRadius + e.radius) {
        reached.push(e);
        this.enemies.splice(i, 1);
      }
    }

    return reached;
  }

  checkProjectileHits(projectiles, particles) {
    const hits = [];
    for (const proj of projectiles) {
      if (proj.dead) continue;
      for (const enemy of this.enemies) {
        if (enemy.dead) continue;
        if (proj.hitEnemies && proj.hitEnemies.has(enemy)) continue;
        const dx = proj.x - enemy.x, dy = proj.y - enemy.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < proj.radius + enemy.hitRadius) {
          const killed = enemy.hit(proj.damage || 1);

          if (proj.pierce) {
            proj.hitEnemies.add(enemy);
          } else {
            proj.dead = true;
          }

          const hitAngle = Math.atan2(dy, dx);
          particles.emitHit(enemy.x, enemy.y, hitAngle, enemy.color);

          if (killed) {
            enemy.dead = true;
            particles.emitRing(enemy.x, enemy.y, { color: enemy.color, maxRadius: enemy.radius * 3, life: 0.4 });
          }

          hits.push({ enemy, killed, score: killed ? enemy.score : 0 });
          if (!proj.pierce) break;
        }
      }
    }
    return hits;
  }

  draw(ctx) {
    for (const e of this.enemies) e.draw(ctx);
  }

  get count() { return this.enemies.length; }
}

// Flick gesture detection and projectile management
class FlickDetector {
  constructor(canvas) {
    this.canvas = canvas;
    this.touches = new Map(); // touchId -> { startX, startY, startTime, x, y }
    this.onFlick = null; // callback(angle, speed, startX, startY)
    this._bind();
  }

  _bind() {
    this.canvas.addEventListener('touchstart', e => this._onStart(e), { passive: true });
    this.canvas.addEventListener('touchmove', e => this._onMove(e), { passive: true });
    this.canvas.addEventListener('touchend', e => this._onEnd(e), { passive: true });
    this.canvas.addEventListener('touchcancel', e => this._onEnd(e), { passive: true });

    // Mouse fallback for desktop testing
    this._mouseDown = false;
    this._mouseStart = null;
    this.canvas.addEventListener('mousedown', e => {
      this._mouseDown = true;
      this._mouseStart = { x: e.clientX, y: e.clientY, time: performance.now() };
    });
    this.canvas.addEventListener('mousemove', e => {
      if (this._mouseDown) this._mouseCur = { x: e.clientX, y: e.clientY };
    });
    this.canvas.addEventListener('mouseup', e => {
      if (!this._mouseDown || !this._mouseStart) return;
      this._mouseDown = false;
      const dx = e.clientX - this._mouseStart.x;
      const dy = e.clientY - this._mouseStart.y;
      const dt = (performance.now() - this._mouseStart.time) / 1000;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 20 && dt < 0.6) {
        const speed = Math.min(dist / dt / 100, 15);
        const angle = Math.atan2(dy, dx);
        if (this.onFlick) this.onFlick(angle, speed, this._mouseStart.x, this._mouseStart.y);
      }
      this._mouseStart = null;
    });
  }

  _onStart(e) {
    for (const t of e.changedTouches) {
      this.touches.set(t.identifier, {
        startX: t.clientX, startY: t.clientY,
        x: t.clientX, y: t.clientY,
        startTime: performance.now(),
      });
    }
  }

  _onMove(e) {
    for (const t of e.changedTouches) {
      const data = this.touches.get(t.identifier);
      if (data) { data.x = t.clientX; data.y = t.clientY; }
    }
  }

  _onEnd(e) {
    for (const t of e.changedTouches) {
      const data = this.touches.get(t.identifier);
      if (!data) continue;
      this.touches.delete(t.identifier);

      const dx = t.clientX - data.startX;
      const dy = t.clientY - data.startY;
      const dt = (performance.now() - data.startTime) / 1000;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 30 && dt < 0.5) {
        const speed = Math.min(dist / dt / 80, 18);
        const angle = Math.atan2(dy, dx);
        if (this.onFlick) this.onFlick(angle, speed, data.startX, data.startY);
      }
    }
  }

  getActiveTouches() {
    return Array.from(this.touches.values());
  }
}

class Projectile {
  constructor(x, y, angle, speed, opts = {}) {
    const { damage = 1, sizeBonus = 0, pierce = false } = opts;
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.speed = speed * 380;
    this.vx = Math.cos(angle) * this.speed;
    this.vy = Math.sin(angle) * this.speed;
    // Larger base size for better hit detection
    this.radius = 14 + damage * 3 + sizeBonus;
    this.damage = damage;
    this.pierce = pierce;
    this.hitEnemies = pierce ? new Set() : null;
    this.dead = false;
    this.age = 0;
    this.maxAge = 1.2;
    this.trail = [];
    // Color by damage level
    const colors = ['#00d4ff', '#ffd60a', '#bf5af2', '#ff2d55'];
    this.color = colors[Math.min(damage - 1, colors.length - 1)];
    const glows = ['rgba(0,212,255,0.5)', 'rgba(255,214,10,0.5)', 'rgba(191,90,242,0.5)', 'rgba(255,45,85,0.5)'];
    this.glowColor = glows[Math.min(damage - 1, glows.length - 1)];
    // Pierce gets a special indicator
    if (pierce) { this.color = '#30d158'; this.glowColor = 'rgba(48,209,88,0.5)'; }
  }

  update(dt, cw, ch) {
    if (this.dead) return;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 8) this.trail.shift();

    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.age += dt;

    if (this.age > this.maxAge || this.x < -60 || this.x > cw + 60 || this.y < -60 || this.y > ch + 60) {
      this.dead = true;
    }
  }

  draw(ctx) {
    if (this.dead) return;
    const alpha = Math.max(0, 1 - this.age / this.maxAge);

    // Trail
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const ta = (i / this.trail.length) * 0.4 * alpha;
      ctx.save();
      ctx.globalAlpha = ta;
      ctx.fillStyle = this.color;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 6;
      const tr = this.radius * (i / this.trail.length) * 0.7;
      ctx.beginPath();
      ctx.arc(t.x, t.y, tr, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Projectile body
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = this.glowColor;
    ctx.shadowBlur = 22;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fill();

    // Inner bright core
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.38, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class ProjectileManager {
  constructor() {
    this.projectiles = [];
  }

  fire(x, y, angle, speedFactor, opts = {}) {
    this.projectiles.push(new Projectile(x, y, angle, speedFactor, opts));
  }

  update(dt, cw, ch) {
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      this.projectiles[i].update(dt, cw, ch);
      if (this.projectiles[i].dead) this.projectiles.splice(i, 1);
    }
  }

  draw(ctx) {
    for (const p of this.projectiles) p.draw(ctx);
  }

  get active() { return this.projectiles.filter(p => !p.dead); }
}

  game.shieldActive = false;
  game.shieldTimer = 0;
  game.upgrades = { damage: 1, fireCount: 1, speedBonus: 0, sizeBonus: 0, spread: false, pierce: false };

  player.x = canvas.width / 2;
  player.y = canvas.height / 2;

  enemies.setWave(1);
  particles.particles = [];
  projectiles.projectiles = [];

  ui.scoreEl.textContent = '0';
  ui.waveEl.textContent = '1';
  updateHearts();

  showScreen('hud');
  showWaveAnnounce('WAVE 1');
  Audio.waveStart(1);

  game.lastTime = performance.now();
  requestAnimationFrame(loop);
}

function getWaveKillTarget(wave) {
  return 8 + wave * 3;
}

function takeDamage() {
  if (game.shieldActive) {
    game.shieldActive = false;
    game.shieldTimer = 0;
    particles.emitRing(player.x, player.y, { color: '#00d4ff', maxRadius: 80, life: 0.4, lineWidth: 4 });
    return;
  }
  game.lives--;
  game.combo = 0;
  ui.comboDisplay.classList.add('hidden');
  Audio.damage();
  updateHearts();
  particles.emitDamage(player.x, player.y);

  game.shakeTime = 0.3;
  game.shakeIntensity = 12;

  damageFlash.classList.add('active');
  setTimeout(() => damageFlash.classList.remove('active'), 100);

  if (navigator.vibrate) navigator.vibrate([30, 20, 50]);

  if (game.lives <= 0) triggerGameOver();
}

function addScore(pts) {
  const multiplier = 1 + Math.floor(game.combo / 5) * 0.5;
  const actual = Math.round(pts * multiplier);
  game.score += actual;
  return actual;
}

function incrementCombo() {
  game.combo++;
  game.comboTimer = game.comboTimeout;
  if (game.combo > game.maxCombo) game.maxCombo = game.combo;

  if (game.combo >= 3) {
    ui.comboDisplay.classList.remove('hidden');
    ui.comboCount.textContent = game.combo;
    Audio.combo(game.combo);
    if (game.combo % 5 === 0) {
      particles.emitRing(player.x, player.y, { color: '#ffd60a', maxRadius: 70, life: 0.5, lineWidth: 3 });
    }
  }
}

// ── Upgrade system ──
function advanceWave() {
  game.wave++;
  game.waveKills = 0;
  game.waveKillTarget = getWaveKillTarget(game.wave);
  projectiles.projectiles = [];
  ui.waveEl.textContent = game.wave;

  game.state = STATE.UPGRADING;
  showUpgradeScreen();
}

function showUpgradeScreen() {
  ui.upgradeWaveLabel.textContent = `WAVE ${game.wave - 1} CLEAR!`;

  const available = UPGRADE_POOL.filter(u => !u.available || u.available(game));
  // Pick 3 non-duplicate upgrades (weighted: epic rarer)
  const shuffled = [...available].sort(() => Math.random() - 0.5).slice(0, 3);

  ui.upgradeCards.innerHTML = '';
  for (const upg of shuffled) {
    const btn = document.createElement('button');
    btn.className = `upgrade-card rarity-${upg.rarity}`;
    btn.innerHTML = `
      <span class="upgrade-icon">${upg.icon}</span>
      <div class="upgrade-info">
        <div class="upgrade-name">${upg.name}</div>
        <div class="upgrade-desc">${upg.desc}</div>
      </div>
      <span class="upgrade-rarity-badge rarity-${upg.rarity}">${
        upg.rarity === 'epic' ? 'EPIC' : upg.rarity === 'rare' ? 'RARE' : 'COM'
      }</span>
    `;
    btn.addEventListener('click', () => selectUpgrade(upg));
    ui.upgradeCards.appendChild(btn);
  }

  showScreen('upgrade');
}

function selectUpgrade(upg) {
  upg.apply(game);
  Audio.unlock();
  particles.emitRing(player.x, player.y, { color: '#ffd60a', maxRadius: 80, life: 0.5, lineWidth: 4 });
  particles.emit(player.x, player.y, { count: 15, color: '#ffd60a', speed: 5, size: 5, life: 0.6 });

  enemies.setWave(game.wave);
  game.state = STATE.PLAYING;
  showScreen('hud');
  showWaveAnnounce(`WAVE ${game.wave}${game.wave % 5 === 0 ? ' ⚠️ BOSS' : ''}`);
  Audio.waveStart(game.wave);

  game.lastTime = performance.now();
  requestAnimationFrame(loop);
}

function triggerGameOver() {
  game.state = STATE.GAMEOVER;
  Audio.gameOver();

  const isNewRecord = game.score > game.bestScore;
  if (isNewRecord) {
    game.bestScore = game.score;
    localStorage.setItem('flickstrike_best', game.bestScore);
  }

  ui.finalScore.textContent = game.score;
  ui.finalWave.textContent = game.wave;
  ui.finalCombo.textContent = game.maxCombo;
  ui.finalBest.textContent = game.bestScore;
  ui.newRecordRow.style.display = isNewRecord ? 'flex' : 'none';

  showScreen('gameover');
}

// ── Flick handler ──
function handleFlick(angle, speed, startX, startY) {
  if (game.state !== STATE.PLAYING) return;
  Audio.flick();

  const spd = Math.min(speed, 15) + game.upgrades.speedBonus;
  const opts = {
    damage: game.upgrades.damage,
    sizeBonus: game.upgrades.sizeBonus,
    pierce: game.upgrades.pierce,
  };

  // Main shot(s)
  for (let i = 0; i < game.upgrades.fireCount; i++) {
    const offset = i === 0 ? 0 : (i % 2 === 1 ? 1 : -1) * 0.12 * Math.ceil(i / 2);
    projectiles.fire(player.x, player.y, angle + offset, spd, opts);
  }

  // Spread side shots (slightly weaker)
  if (game.upgrades.spread) {
    const sideOpts = { ...opts, damage: Math.max(1, opts.damage - 1) };
    projectiles.fire(player.x, player.y, angle + 0.4, spd * 0.85, sideOpts);
    projectiles.fire(player.x, player.y, angle - 0.4, spd * 0.85, sideOpts);
  }

  particles.emitTrail(startX, startY, '#00d4ff', 5);
  particles.emit(player.x, player.y, {
    count: 5 + game.upgrades.fireCount,
    color: '#00d4ff',
    speed: 4,
    spreadAngle: Math.PI * 0.4,
    dirAngle: angle,
    size: 4,
    life: 0.3,
  });
}

// ── Camera shake ──
function applyCameraShake(dt) {
  if (!game.shakeTime) return;
  game.shakeTime -= dt;
  if (game.shakeTime <= 0) { game.shakeTime = 0; return; }
  const intensity = game.shakeIntensity * (game.shakeTime / 0.3);
  ctx.translate(
    (Math.random() - 0.5) * intensity,
    (Math.random() - 0.5) * intensity
  );
}

// ── Draw background ──
function drawBackground(dt) {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const star of game.bgStars) {
    star.a += dt * star.speed;
    const alpha = (Math.sin(star.a) * 0.5 + 0.5) * 0.6 + 0.1;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fill();
  }

  const cx = canvas.width / 2, cy = canvas.height / 2;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(canvas.width, canvas.height) * 0.5);
  grad.addColorStop(0, 'rgba(0,100,180,0.06)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const closest = getClosestEnemyDist();
  if (closest < 200) {
    const danger = 1 - closest / 200;
    const ringGrad = ctx.createRadialGradient(cx, cy, player.radius + 20, cx, cy, player.radius + 80);
    ringGrad.addColorStop(0, `rgba(255,45,85,${danger * 0.15})`);
    ringGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ringGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function getClosestEnemyDist() {
  let min = Infinity;
  for (const e of enemies.enemies) {
    const dx = e.x - player.x, dy = e.y - player.y;
    min = Math.min(min, Math.sqrt(dx * dx + dy * dy));
  }
  return min;
}

// ── Proximity radar: always-visible enemy direction indicators ──
function drawProximityRadar() {
  const cx = player.x, cy = player.y;
  const radarR = player.radius + 55; // ring just outside player glow
  const w = canvas.width, h = canvas.height;
  const margin = 26;

  for (const e of enemies.enemies) {
    const dx = e.x - cx, dy = e.y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const angle = Math.atan2(dy, dx);

    // ── Proximity dot on the radar ring (always visible) ──
    const dotX = cx + Math.cos(angle) * radarR;
    const dotY = cy + Math.sin(angle) * radarR;
    const proximity = Math.max(0, 1 - dist / 320);
    const dotAlpha = 0.3 + proximity * 0.65;
    const dotSize = 3.5 + proximity * 4.5;

    ctx.save();
    ctx.globalAlpha = dotAlpha;
    ctx.fillStyle = e.color;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = dotSize * 2.5;
    ctx.beginPath();
    ctx.arc(dotX, dotY, dotSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ── Edge arrow for off-screen enemies ──
    const halfW = w / 2 - margin, halfH = h / 2 - margin;
    const absDx = Math.abs(dx), absDy = Math.abs(dy);
    if (absDx === 0 && absDy === 0) continue;
    const scaleX = absDx > 0 ? halfW / absDx : Infinity;
    const scaleY = absDy > 0 ? halfH / absDy : Infinity;
    const edgeScale = Math.min(scaleX, scaleY);

    if (edgeScale < 1) {
      const ex = cx + dx * edgeScale;
      const ey = cy + dy * edgeScale;
      ctx.save();
      ctx.translate(ex, ey);
      ctx.rotate(angle);
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = e.color;
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 12;
      const s = 8;
      ctx.beginPath();
      ctx.moveTo(s + 2, 0);
      ctx.lineTo(-s, -s * 0.65);
      ctx.lineTo(-s, s * 0.65);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }
}

// ── Draw player ──
function drawPlayer() {
  const { x, y, radius } = player;
  player.pulse = (player.pulse || 0) + 0.04;
  const scale = 1 + Math.sin(player.pulse) * 0.04;

  ctx.save();
  ctx.translate(x, y);

  if (game.shieldActive) {
    const shieldAlpha = 0.3 + Math.sin(player.pulse * 3) * 0.2;
    ctx.strokeStyle = `rgba(0,212,255,${shieldAlpha})`;
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00d4ff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(0, 0, player.shieldRadius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = `rgba(0,212,255,${shieldAlpha * 0.15})`;
    ctx.fill();
  }

  ctx.strokeStyle = 'rgba(0,212,255,0.3)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#00d4ff';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(0, 0, radius * scale * 1.4, 0, Math.PI * 2);
  ctx.stroke();

  const grad = ctx.createRadialGradient(-4, -4, 2, 0, 0, radius * scale);
  grad.addColorStop(0, '#80e8ff');
  grad.addColorStop(0.5, '#00d4ff');
  grad.addColorStop(1, '#0060ff');
  ctx.fillStyle = grad;
  ctx.shadowColor = '#00d4ff';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.arc(0, 0, radius * scale, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(-4, -4, radius * 0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ── Draw flick indicator ──
function drawFlickHint() {
  if (!flickDetector) return;
  const touches = flickDetector.getActiveTouches();
  for (const t of touches) {
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(t.startX, t.startY);
    ctx.lineTo(t.x || t.startX, t.y || t.startY);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(t.startX, t.startY, 20, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

// ── Draw wave progress ──
function drawWaveProgress() {
  const w = canvas.width;
  const barW = Math.min(200, w * 0.4);
  const barH = 4;
  const bx = w / 2 - barW / 2;
  const by = 72;
  const pct = Math.min(1, game.waveKills / game.waveKillTarget);

  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(bx, by, barW, barH);

  const barGrad = ctx.createLinearGradient(bx, 0, bx + barW, 0);
  barGrad.addColorStop(0, '#00d4ff');
  barGrad.addColorStop(1, '#0080ff');
  ctx.fillStyle = barGrad;
  ctx.shadowColor = '#00d4ff';
  ctx.shadowBlur = 6;
  ctx.fillRect(bx, by, barW * pct, barH);
  ctx.restore();
}

// ── Draw active upgrade icons ──
function drawUpgradeIcons() {
  const icons = [];
  if (game.upgrades.damage > 1) icons.push({ icon: '⚔️', label: `×${game.upgrades.damage}` });
  if (game.upgrades.fireCount > 1) icons.push({ icon: '🔫', label: `×${game.upgrades.fireCount}` });
  if (game.upgrades.spread) icons.push({ icon: '🎯', label: '' });
  if (game.upgrades.pierce) icons.push({ icon: '🏹', label: '' });
  if (game.upgrades.speedBonus > 0) icons.push({ icon: '⚡', label: '' });
  if (game.upgrades.sizeBonus > 0) icons.push({ icon: '💫', label: '' });
  if (game.shieldActive) icons.push({ icon: '🛡️', label: '' });
  if (!icons.length) return;

  const iconSize = 18;
  const gap = 4;
  const totalW = icons.length * (iconSize + gap) - gap;
  let x = canvas.width / 2 - totalW / 2;
  const y = canvas.height - 28 - (window.visualViewport?.offsetTop || 0);

  ctx.save();
  ctx.font = `${iconSize}px sans-serif`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  for (const item of icons) {
    ctx.globalAlpha = 0.85;
    ctx.fillText(item.icon, x, y);
    if (item.label) {
      ctx.globalAlpha = 0.9;
      ctx.font = 'bold 10px sans-serif';
      ctx.fillStyle = '#ffd60a';
      ctx.fillText(item.label, x + iconSize - 2, y + 6);
      ctx.font = `${iconSize}px sans-serif`;
    }
    x += iconSize + gap;
  }
  ctx.restore();
}

// ── Main game loop ──
function loop(timestamp) {
  if (game.state !== STATE.PLAYING) return;

  const dt = Math.min((timestamp - game.lastTime) / 1000, 0.05);
  game.lastTime = timestamp;

  ctx.save();
  applyCameraShake(dt);

  update(dt);

  drawBackground(dt);
  drawFlickHint();
  particles.draw(ctx);
  projectiles.draw(ctx);
  enemies.draw(ctx);
  drawPlayer();
  drawProximityRadar();
  drawWaveProgress();
  drawUpgradeIcons();

  ctx.restore();

  updateScoreDisplay();

  requestAnimationFrame(loop);
}

function update(dt) {
  if (game.shieldActive && game.shieldTimer < 9999) {
    game.shieldTimer -= dt;
    if (game.shieldTimer <= 0) game.shieldActive = false;
  }

  if (game.combo > 0) {
    game.comboTimer -= dt;
    if (game.comboTimer <= 0) {
      game.combo = 0;
      ui.comboDisplay.classList.add('hidden');
    }
  }

  particles.update(dt);
  projectiles.update(dt, canvas.width, canvas.height);

  const hits = enemies.checkProjectileHits(projectiles.active, particles);
  for (const hit of hits) {
    if (hit.killed) {
      const pts = addScore(hit.enemy.score);
      game.waveKills++;
      incrementCombo();
      particles.emitScore(hit.enemy.x, hit.enemy.y - hit.enemy.radius - 10, `+${pts}`, '#ffd60a');
      Audio.enemyDeath();
    } else {
      Audio.hit();
    }
  }

  const reached = enemies.update(dt, canvas.width, canvas.height, player.radius + (game.shieldActive ? player.shieldRadius - player.radius : 0));
  if (reached.length > 0) takeDamage();

  if (!game.waveTransition && game.waveKills >= game.waveKillTarget) {
    game.waveTransition = true;
    setTimeout(() => {
      game.waveTransition = false;
      advanceWave();
    }, 800);
  }
}

// ── Button bindings ──
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);
document.getElementById('title-btn').addEventListener('click', () => { game.state = STATE.MENU; showScreen('start'); });
document.getElementById('quit-btn').addEventListener('click', () => { game.state = STATE.MENU; showScreen('start'); });
document.getElementById('resume-btn').addEventListener('click', () => {
  game.state = STATE.PLAYING;
  game.lastTime = performance.now();
  showScreen('hud');
  requestAnimationFrame(loop);
});
document.getElementById('pause-btn').addEventListener('click', () => {
  if (game.state === STATE.PLAYING) {
    game.state = STATE.PAUSED;
    showScreen('pause');
  }
});

// ── Init ──
initStars();
showScreen('start');

window.addEventListener('load', () => {
  flickDetector = new FlickDetector(canvas);
  flickDetector.onFlick = handleFlick;
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

</script>
